name: Publish SPM

# Builds the :nepali-date-picker:ui XCFramework and publishes it as a self-contained
# Swift Package Manager release to the sibling shivathapaa/Nepali-Date-Picker-SPM repo.
# The zip is uploaded as a release asset, Package.swift is updated with its checksum,
# and a matching semver tag/release is created alongside the Maven Central release.
on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)publish to SPM, e.g. 3.1.0. The XCFramework is built from this tag."
        required: true
        type: string

concurrency:
  # One SPM publish per version; never cancel in-flight releases to avoid
  # leaving the asset and Package.swift commit out of sync.
  group: publish-spm-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

# This workflow reads this repo's source and writes to the SPM repo via the PAT.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4

  publish-spm:
    name: Build XCFramework and release to SPM repo
    needs: validate-wrapper
    runs-on: macos-latest
    timeout-minutes: 60
    environment: spm-release
    steps:
      - name: Resolve version and source tag
        id: v
        run: |
          set -euo pipefail
          raw="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$raw" ]; then
            echo "::error::No tag available from the release event or the workflow_dispatch input."
            exit 1
          fi
          version="${raw#v}"
          echo "raw_tag=$raw" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing SPM version '$version' (source tag '$raw')."

      - name: Checkout this repo at the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.v.outputs.raw_tag }}

      # Parity with the Maven publish: on a real release the tag must match the
      # version we build. Skipped on manual dispatch so old tags can be backfilled
      # (their VERSION_NAME may differ from the current main branch).
      - name: Verify tag matches VERSION_NAME
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          version_name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version_name" ]; then
            echo "::error::Could not read VERSION_NAME from gradle.properties"
            exit 1
          fi
          if [ "${{ steps.v.outputs.version }}" != "$version_name" ]; then
            echo "::error::Release tag '${{ steps.v.outputs.version }}' does not match gradle.properties VERSION_NAME '$version_name'."
            exit 1
          fi
          echo "Tag matches VERSION_NAME ($version_name)."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release XCFrameworks
        run: |
          ./gradlew \
            :nepali-date-picker:ui:assembleNepali-date-pickerReleaseXCFramework \
            :nepali-date-picker:core:assembleNepali-date-picker-coreReleaseXCFramework \
            --stacktrace

      - name: Zip XCFrameworks and compute checksums
        id: pkg
        run: |
          set -euo pipefail
          # Kotlin/Native sanitises a framework baseName into a valid identifier,
          # so "nepali-date-picker" lands on disk as nepali_date_picker.xcframework.
          # Discover each one instead of hardcoding, so a future rename surfaces
          # as a clear failure here rather than a broken release asset.
          pack() {
            local key="$1" dir="$2"
            local count fw zip checksum
            count=$(find "$dir" -maxdepth 1 -name '*.xcframework' | wc -l | tr -d '[:space:]')
            if [ "$count" != "1" ]; then
              echo "::error::Expected exactly one .xcframework in $dir, found $count."
              exit 1
            fi
            fw=$(basename "$(find "$dir" -maxdepth 1 -name '*.xcframework')")
            zip="${fw}.zip"
            # ditto --keepParent makes the .xcframework directory the archive root
            # (what SwiftPM expects) and, unlike Finder/zip, adds no __MACOSX cruft.
            ( cd "$dir" && ditto -c -k --keepParent "$fw" "$zip" )
            checksum=$(swift package compute-checksum "$dir/$zip")
            {
              echo "${key}_zip_name=$zip"
              echo "${key}_zip_path=$dir/$zip"
              echo "${key}_checksum=$checksum"
            } >> "$GITHUB_OUTPUT"
            echo "$key -> $zip ($(du -h "$dir/$zip" | cut -f1)), sha256 $checksum"
          }
          pack ui   "nepali-date-picker/ui/build/XCFrameworks/release"
          pack core "nepali-date-picker/core/build/XCFrameworks/release"

      - name: Checkout SPM repo
        uses: actions/checkout@v5
        with:
          repository: shivathapaa/Nepali-Date-Picker-SPM
          token: ${{ secrets.SPM_REPO_TOKEN }}
          path: spm-repo
          ref: main

      - name: Write Package.swift
        env:
          VERSION: ${{ steps.v.outputs.version }}
          UI_CHECKSUM: ${{ steps.pkg.outputs.ui_checksum }}
          UI_ZIP_NAME: ${{ steps.pkg.outputs.ui_zip_name }}
          CORE_CHECKSUM: ${{ steps.pkg.outputs.core_checksum }}
          CORE_ZIP_NAME: ${{ steps.pkg.outputs.core_zip_name }}
        run: |
          set -euo pipefail
          # Deterministic release-asset URLs: both zips are uploaded to a release
          # tagged exactly $VERSION on the SPM repo in a later step.
          #
          # The UI target keeps the published hyphenated name even though the
          # archive holds nepali_date_picker.xcframework. That mismatch is what
          # every released version has shipped and SwiftPM resolves it fine, so
          # renaming the target would churn consumers for no gain.
          base="https://github.com/shivathapaa/Nepali-Date-Picker-SPM/releases/download/${VERSION}"
          cat > spm-repo/Package.swift <<EOF
          // swift-tools-version:5.5

          import PackageDescription

          // Two mutually exclusive products: the UI framework embeds core, so linking both
          // duplicates the Kotlin runtime and core symbols. Use "nepali-date-picker" for UI +
          // conversion, or "nepali-date-picker-core" for conversion only.
          //
          // "nepali-date-picker-core" supports arm64 macOS; the UI product is iOS-only because
          // Compose Multiplatform has no embeddable AppKit host. macOS 12 is the macosArm64
          // minimum; Intel Macs are unsupported.
          let package = Package(
              name: "nepali-date-picker",
              platforms: [
                  .iOS(.v14),
                  .macOS(.v12),
              ],
              products: [
                  .library(name: "nepali-date-picker", targets: ["nepali-date-picker"]),
                  .library(name: "nepali-date-picker-core", targets: ["nepali-date-picker-core"])
              ],
              targets: [
                  .binaryTarget(
                      name: "nepali-date-picker",
                      url: "${base}/${UI_ZIP_NAME}",
                      checksum: "${UI_CHECKSUM}"
                  ),
                  .binaryTarget(
                      name: "nepali-date-picker-core",
                      url: "${base}/${CORE_ZIP_NAME}",
                      checksum: "${CORE_CHECKSUM}"
                  )
              ]
          )
          EOF

      # Catches a malformed manifest before anything is pushed or released.
      # Only syntax and structure: url and checksum cannot be verified until the
      # asset is uploaded, which happens after the commit.
      - name: Validate Package.swift
        working-directory: spm-repo
        run: |
          set -euo pipefail
          swift package dump-package > /dev/null
          echo "Package.swift parses:"
          cat Package.swift

      - name: Commit and push Package.swift
        working-directory: spm-repo
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "Shiva Thapa"
          git config user.email "shivathapa0600@gmail.com"
          if git diff --quiet -- Package.swift; then
            echo "Package.swift already current for ${VERSION}; nothing to commit."
          else
            git add Package.swift
            git commit -m "release: nepali-date-picker ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create SPM release and upload XCFrameworks
        env:
          GH_TOKEN: ${{ secrets.SPM_REPO_TOKEN }}
          REPO: shivathapaa/Nepali-Date-Picker-SPM
          VERSION: ${{ steps.v.outputs.version }}
          SOURCE_TAG: ${{ steps.v.outputs.raw_tag }}
          UI_ZIP: ${{ github.workspace }}/${{ steps.pkg.outputs.ui_zip_path }}
          CORE_ZIP: ${{ github.workspace }}/${{ steps.pkg.outputs.core_zip_path }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
            # Re-run or backfill: replace the assets on the existing release.
            gh release upload "${VERSION}" "${UI_ZIP}" "${CORE_ZIP}" --repo "${REPO}" --clobber
          else
            # Plain string rather than an array: macOS runners still ship bash
            # 3.2, where expanding an empty array under `set -u` aborts the step.
            prerelease_flag=""
            if [ "${PRERELEASE}" = "true" ]; then prerelease_flag="--prerelease"; fi
            # Tags the current main HEAD (the Package.swift commit just pushed).
            gh release create "${VERSION}" "${UI_ZIP}" "${CORE_ZIP}" \
              --repo "${REPO}" \
              --target main \
              --title "${VERSION}" \
              --notes "Swift Package Manager distribution of Nepali Date Picker ${VERSION}. Products: \`nepali-date-picker\` (pickers plus the conversion engine, iOS only) and \`nepali-date-picker-core\` (conversion engine only, iOS and Apple Silicon macOS 12+). Depend on one, never both. Source: https://github.com/shivathapaa/Nepali-Date-Picker/releases/tag/${SOURCE_TAG}" \
              ${prerelease_flag}
          fi
          echo "SPM ${VERSION} published: https://github.com/${REPO}/releases/tag/${VERSION}"
