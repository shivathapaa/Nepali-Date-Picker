name: Publish

# One release triggers this, publish-npm.yml and publish-spm.yml in parallel. Each
# gates on the test matrix independently; none gates on the others. A failed Maven
# publish therefore does not stop npm or SPM, which is deliberate: both of those are
# re-runnable, while a partial Maven deployment needs manual Central Portal cleanup.
on:
  release:
    types: [released, prereleased]

concurrency:
  # A half-cancelled deploy can leave a bundle hanging on Central Portal.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Drop once the gradle/actions/* family ships a Node-24 major.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Tamper-check the wrapper before executing it.
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4

  verify-version:
    name: Verify release tag matches VERSION_NAME
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compare release tag to gradle.properties
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          version_name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version_name" ]; then
            echo "::error::Could not read VERSION_NAME from gradle.properties"
            exit 1
          fi
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Release tag '$tag' does not match gradle.properties VERSION_NAME '$version_name'. Bump VERSION_NAME or retag before publishing."
            exit 1
          fi
          echo "✅ Tag '$tag' matches VERSION_NAME '$version_name'."

  test:
    needs: [validate-wrapper, verify-version]
    uses: ./.github/workflows/_test.yml

  publish:
    name: Publish to Maven Central
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    # Add protection rules to this environment in repo settings for a human gate.
    environment: maven-central
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish :core, :ui and :serialization in a single Gradle run
        # One invocation, so a failure stops the modules after it. Nothing promotes
        # several Central deployments atomically, so a module releasing before a
        # later one fails still needs manual cleanup.
        #
        # :serialization must stay listed. Its absence is why
        # `nepali-date-picker-serialization` never reached Central before 3.2.0.
        run: |
          ./gradlew \
            :nepali-date-picker:core:publishAndReleaseToMavenCentral \
            :nepali-date-picker:ui:publishAndReleaseToMavenCentral \
            :nepali-date-picker:serialization:publishAndReleaseToMavenCentral \
            --no-parallel \
            --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
