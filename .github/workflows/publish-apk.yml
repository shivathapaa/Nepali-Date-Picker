name: Publish sample APK

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)attach a sample APK to, e.g. 3.3.0. The APK is built from this tag."
        required: true
        type: string

concurrency:
  group: publish-apk-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4

  test:
    needs: validate-wrapper
    uses: ./.github/workflows/_test.yml

  publish-apk:
    name: Build sample APK and attach to the release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve version and source tag
        id: v
        run: |
          set -euo pipefail
          raw="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$raw" ]; then
            echo "::error::No tag available from the release event or the workflow_dispatch input."
            exit 1
          fi
          echo "raw_tag=$raw" >> "$GITHUB_OUTPUT"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout at the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.v.outputs.raw_tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the sample app
        run: ./gradlew :sample:androidApp:assembleDebug --stacktrace

      - name: Locate and name the APK
        id: apk
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          found=$(find sample/androidApp/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | wc -l | tr -d '[:space:]')
          if [ "$found" != "1" ]; then
            echo "::error::Expected exactly one APK in sample/androidApp/build/outputs/apk/debug, found $found."
            exit 1
          fi
          src=$(find sample/androidApp/build/outputs/apk/debug -maxdepth 1 -name '*.apk')
          mkdir -p build/release-assets
          cp "$src" "build/release-assets/nepali-date-picker-sample.apk"
          echo "path=build/release-assets/nepali-date-picker-sample.apk" >> "$GITHUB_OUTPUT"
          echo "Sample APK for ${VERSION}: $(du -h "build/release-assets/nepali-date-picker-sample.apk" | cut -f1)"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.raw_tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "${VERSION}" "${APK}" --repo "${{ github.repository }}" --clobber
          echo "Attached nepali-date-picker-sample.apk to ${VERSION}."
