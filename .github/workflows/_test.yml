name: Test

# Reusable workflow that runs the full :core + :ui test matrix on macOS,
# Linux and Windows. Used by both ci.yml (per-PR) and publish.yml (release gate).
on:
  workflow_call:

# Drop once the gradle/actions/* family ships a Node-24 major.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Surface failures from every host, so the release gate sees the whole picture.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Apple natives + JVM + Android host + Wasm WASI node. The Android sample and
      # the JS/Wasm-JS node tests are on the Linux leg instead: same tasks, cheaper
      # minutes, and the macOS Node runtime has flaked at `node:internal/timers`.
      # Wasm WASI stays here because it has no Linux-leg twin.
      - name: Build & test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./gradlew \
            :nepali-date-picker:core:iosSimulatorArm64Test \
            :nepali-date-picker:core:macosArm64Test \
            :nepali-date-picker:core:jvmTest \
            :nepali-date-picker:core:testAndroidHostTest \
            :nepali-date-picker:core:wasmWasiNodeTest \
            :nepali-date-picker:serialization:iosSimulatorArm64Test \
            :nepali-date-picker:serialization:macosArm64Test \
            :nepali-date-picker:serialization:jvmTest \
            :nepali-date-picker:serialization:testAndroidHostTest \
            :nepali-date-picker:serialization:wasmWasiNodeTest \
            :nepali-date-picker:ui:iosSimulatorArm64Test \
            :nepali-date-picker:ui:macosArm64Test \
            :nepali-date-picker:ui:jvmTest \
            :nepali-date-picker:ui:checkBridgeCoverage \
            --stacktrace

      # Linking the framework takes minutes, so the export snapshot runs only on macOS and only
      # here, not in the fast local loop.
      - name: Verify the iOS export surface
        if: runner.os == 'macOS'
        run: ./gradlew :nepali-date-picker:ui:checkIosApi --stacktrace

      # The only check that exercises the bridge as a consumer does, and so the only
      # place the Xcode-side requirements (arm64-only slices, module name, Compose
      # plist key) can regress. The framework must exist before xcodebuild starts,
      # since Xcode resolves the Swift module graph while planning; checkIosApi above
      # already assembled it.
      - name: Build the Swift sample
        if: runner.os == 'macOS'
        working-directory: sample/iosSwiftApp
        run: |
          xcodebuild \
            -project iosSwiftApp.xcodeproj \
            -scheme iosSwiftApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build

      # Linux: JVM + Android host + JS/Wasm node + linuxX64 native + sample. No Apple, no mingw.
      - name: Build & test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew \
            :nepali-date-picker:core:jvmTest \
            :nepali-date-picker:core:testAndroidHostTest \
            :nepali-date-picker:core:jsNodeTest \
            :nepali-date-picker:core:wasmJsNodeTest \
            :nepali-date-picker:core:wasmWasiNodeTest \
            :nepali-date-picker:core:linuxX64Test \
            :nepali-date-picker:serialization:jvmTest \
            :nepali-date-picker:serialization:testAndroidHostTest \
            :nepali-date-picker:serialization:jsNodeTest \
            :nepali-date-picker:serialization:wasmJsNodeTest \
            :nepali-date-picker:serialization:wasmWasiNodeTest \
            :nepali-date-picker:serialization:linuxX64Test \
            :sample:androidApp:assembleDebug \
            --stacktrace

      # Windows: mingwX64 only - everything else is covered elsewhere.
      - name: Build & test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./gradlew \
            :nepali-date-picker:core:mingwX64Test \
            :nepali-date-picker:serialization:mingwX64Test \
            --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 30

  # Workflow shell blocks are only executed on release, so a mistake in one sits undiscovered until
  # it breaks a publish. Lint them on every run instead.
  workflow-shell:
    name: Lint workflow shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Extract run blocks
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          mkdir -p /tmp/wf
          python3 - <<'PY'
          import glob, os, re, yaml
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              spec = yaml.safe_load(open(path))
              for job_name, job in (spec.get("jobs") or {}).items():
                  for index, step in enumerate(job.get("steps") or []):
                      script = step.get("run")
                      if not script:
                          continue
                      # GitHub expands its expression syntax before the shell sees it, so
                      # substitute a plain token rather than leaving syntax shellcheck cannot read.
                      script = re.sub(r"\$\{\{[^}]*\}\}", "GHA_EXPR", script)
                      name = f"{os.path.basename(path)}-{job_name}-{index}".replace("/", "_")
                      with open(f"/tmp/wf/{name}.sh", "w") as out:
                          out.write("#!/usr/bin/env bash\n" + script)
          PY
          find /tmp/wf -name '*.sh' | wc -l

      # SC2050 fires on the GHA_EXPR placeholders substituted above, which are constants by
      # construction. Style and info findings are not worth failing a build over.
      - name: shellcheck
        run: shellcheck -s bash --severity=warning --exclude=SC2050 /tmp/wf/*.sh

      - name: Reject empty-array expansion under set -u
        run: |
          set -euo pipefail
          offenders=$(grep -lE '\$\{[A-Za-z_][A-Za-z0-9_]*\[@\]\}' /tmp/wf/*.sh || true)
          failed=0
          for file in $offenders; do
            if grep -qE 'set -[a-z]*u' "$file"; then
              echo "::error::$file expands an array under 'set -u'. On bash 3.2 that aborts when the array is empty; use a plain string flag instead."
              failed=1
            fi
          done
          exit "$failed"

  # Guards the npm packaging and the DOM component. The Kotlin wrapper's own logic is
  # already covered by the Linux `jsNodeTest` leg.
  js:
    name: Build & test JS packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # Both workspaces this job installs, so either change invalidates the cache.
          cache-dependency-path: |
            js/package-lock.json
            sample/jsApp/package-lock.json

      - name: Compile Kotlin/JS engine into the npm package
        run: ./gradlew :nepali-date-picker:core:packJsCore --stacktrace

      - name: Install workspace dependencies
        working-directory: js
        run: npm ci

      - name: Type-check, build, and test the web component
        working-directory: js
        run: |
          npm run --workspace @nepali-date-picker/web-component typecheck
          npm run --workspace @nepali-date-picker/web-component build
          npm run --workspace @nepali-date-picker/web-component typecheck:jsx
          npm run --workspace @nepali-date-picker/web-component test

      - name: Fail if custom-elements.json is stale
        working-directory: js/packages/web-component
        run: npm run check:manifest

      - name: Build the web-component showcase (sample/jsApp)
        working-directory: sample/jsApp
        run: |
          npm ci
          npm run build
